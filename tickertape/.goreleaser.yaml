version: 2
project_name: tickertape-pp-cli
changelog:
  disable: true
builds:
  - id: tickertape-pp-cli
    main: ./cmd/tickertape-pp-cli
    binary: tickertape-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X tickertape-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: tickertape-pp-mcp
    main: ./cmd/tickertape-pp-mcp
    binary: tickertape-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: tickertape-pp-cli
    repository:
      owner: dev-abhirup-sc
      name: homebrew-tap
    homepage: "https://github.com/dev-abhirup-sc/tickertape-pp-cli"
    description: "Live, provenance-aware Tickertape research without stale local market data"
    install: |
      bin.install "tickertape-pp-cli"
      bin.install "tickertape-pp-mcp"
